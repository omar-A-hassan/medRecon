[project]
name = "medrecon"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.3",
    "torchvision>=0.18",
    "segmentation-models-pytorch>=0.3",
    "opencv-python>=4.9",
    "scikit-image>=0.23",
    "tqdm>=4.66",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/medrecon"]

[tool.uv]
dev-dependencies = ["ipykernel"]
